[package]
name = "kinetix-plugin-claude-code-oauth"
version = "0.1.8"
edition = "2021"
description = "Kinetix plugin: Claude Code OAuth credential strategy."
license = "MIT"
repository = "https://github.com/0x1d1e/kinetix-plugins"

[lib]
crate-type = ["cdylib"]

[dependencies]
kinetix-plugin-sdk = { path = "../../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
kinetix-credential-conformance = { path = "../../credential-conformance", features = ["runtime"] }
