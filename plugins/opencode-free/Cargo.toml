[package]
name = "kinetix-plugin-opencode-free"
version = "0.1.8"
edition = "2021"
description = "Kinetix plugin: OpenCode Free no-auth provider adapter and dynamic model discovery."
license = "MIT"
repository = "https://github.com/PrightCord/kinetix-plugins"

[lib]
crate-type = ["cdylib"]

[dependencies]
kinetix-plugin-sdk = { path = "../../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
kinetix-adapter-conformance = { path = "../../adapter-conformance" }
