manifest_version = 1
id = "dev.kinetix.opencode-free"
name = "OpenCode Free"
version = "0.1.9"
plugin_api = "2"

[provides]
model_sources = ["opencode-free-models"]
provider_adapters = ["opencode-free"]

[[integrations]]
id = "opencode-free"
name = "OpenCode Free"
description = "Use OpenCode's anonymous free-tier models with dynamic model discovery."
provider_adapter = "opencode-free"
model_source = "opencode-free-models"

[integrations.features]
schema_version = 1
streaming = true
tools = true
parallel_tools = true
vision = false
reasoning = true
structured_output = false
model_discovery = true
quota_probe = false
health_probe = false

[integrations.protocols]
input = ["openai-chat", "openai-responses", "anthropic"]
upstream = ["plugin-native"]

[integrations.provider]
base_url = "https://opencode.ai"
wire_format = "plugin"
auth_scheme = "bearer"
models_path = "/zen/v1/models"
timeout_ms = 120000
capability_mode = "permissive"
follow_redirects = false

[permissions]
network_hosts = ["opencode.ai"]
credential_scopes = []
credential_read = false

[limits]
memory = "64MiB"
wall_time_ms = 10000
max_outbound_requests = 2
max_http_body = "2MiB"
storage = "64KiB"
