[package]
name = "kinetix-plugin-antigravity-oauth"
version = "0.1.19"
edition = "2021"
description = "Kinetix plugin: Antigravity (Google Cloud Code Assist) OAuth credential strategy."
license = "MIT"
repository = "https://github.com/PrightCord/kinetix-plugins"

[lib]
crate-type = ["cdylib"]

[dependencies]
kinetix-plugin-sdk = { path = "../../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
kinetix-adapter-conformance = { path = "../../adapter-conformance" }
kinetix-credential-conformance = { path = "../../credential-conformance", features = ["runtime"] }
kinetix-discovery-conformance = { path = "../../discovery-conformance", features = ["runtime"] }
